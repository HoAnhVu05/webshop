<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh sách đơn hàng</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <h2>Đơn hàng của số điện thoại: <span th:text="${phone}"></span></h2>

  <div th:if="${#lists.isEmpty(orders)}">
    <p>Không tìm thấy đơn hàng nào.</p>
  </div>

  <div th:if="${!#lists.isEmpty(orders)}">
    <table class="table table-bordered">
      <thead>
      <tr>
        <th>ID đơn hàng</th>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Ngày đặt</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.product.name}"></td>
        <td th:text="${order.product.price}"></td>
        <td th:text="${order.orderDate != null ? order.orderDate : 'N/A'}">Ngày đặt</td>
        <td>
          <!-- Nút hủy đơn -->
          <button style="background:none; border:none; font-size:20px; cursor:pointer;"
                  th:attr="data-id=${order.id}"
                  onclick="setOrderId(this); $('#confirmModal').modal('show');">
            ❌
          </button>




      </tr>
      </tbody>
    </table>
    <!-- Modal xác nhận hủy đơn -->
    <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmModalLabel">Xác nhận hủy đơn</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            Bạn có chắc chắn muốn hủy đơn hàng này?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
            <form id="cancelOrderForm" method="post" th:action="@{/cancel}">
              <input type="hidden" id="orderId" name="orderId">
              <button type="submit" class="btn btn-danger">Hủy đơn</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS & jQuery (bắt buộc cho modal và các tính năng khác của Bootstrap) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  $(document).ready(function() {
      $('#cancelOrderForm').on('submit', function(e) {
          console.log("Form submit triggered");
          var orderId = $('#orderId').val();
          console.log("Submitting with orderId: " + orderId);
          if (!orderId || isNaN(orderId)) {
              console.error("Invalid or missing orderId: " + orderId);
              alert("ID đơn hàng không hợp lệ hoặc thiếu.");
              e.preventDefault(); // Ngăn submit nếu orderId sai
          }
      });
  });
</script>
<!--<script src="/js/script.js"></script>-->

<script>
  function setOrderId(button) {
      console.log("setOrderId called");
      var orderId = button.getAttribute('data-id');
      console.log("Raw data-id: " + orderId);
      if (!orderId || isNaN(orderId)) {
          console.error("Invalid orderId: " + orderId);
          alert("Không thể lấy ID đơn hàng. Vui lòng thử lại.");
          return;
      }
      var orderIdInput = document.getElementById('orderId');
      if (!orderIdInput) {
          console.error("Input #orderId not found");
          alert("Không tìm thấy input orderId.");
          return;
      }
      orderIdInput.value = orderId;
      console.log("Set orderId to: " + orderIdInput.value);
  }
</script>

</body>
</html>
